name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次未跑完的运行，避免旧提交占着 runner 排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint (轻量：no-undef / no-unused-vars / no-unreachable 等)
        run: bun run lint

      - name: SQL 迁移目录规约
        run: bun run check:sql

      - name: Vitest 全量
        run: bun run test

      - name: Verify clean working tree after tests
        run: git diff --exit-code

      - name: Open-source security & sanitization check
        run: |
          set -euo pipefail
          LEGACY_BRAND="r""uoyi"
          PRIVATE_NET='(^|[^0-9.])(192[.]168[.]|10[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}|172[.](1[6-9]|2[0-9]|3[01])[.][0-9]{1,3}[.][0-9]{1,3})'
          PRIV_KEY='-----BEGIN ([A-Z0-9 ]+)?PRIV''ATE KEY-----'
          DB_URI_CRED='(mysql|mssql|postgres|postgresql)://[^/:@#[:space:]]+:[^/@#[:space:]]+@'
          ENV_SECRET_VAL='^(TK_.*_PASSWORD|NUXT_.*_(PASSWORD|SECRET|TOKEN))=[^[:space:]]+'

          check_pattern() {
            local label="$1"
            local flags="$2"
            local pattern="$3"
            shift 3
            local rc=0
            git grep $flags -e "$pattern" -- "$@" ':(exclude)bun.lock' ':(exclude).github/workflows/ci.yml' || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::Security/sanitization check failed ($label)."
              exit 1
            elif [ "$rc" -ne 1 ]; then
              echo "::error::git grep error ($rc) during check ($label)."
              exit "$rc"
            fi
          }

          tracked_env=$(git ls-files 'local.env' '.env' '.env.local' '.env.*.local' 'deploy.config.json')
          if [ -n "$tracked_env" ]; then
            echo "::error::Tracked non-example env files detected:"
            echo "$tracked_env"
            exit 1
          fi

          check_pattern "legacy branding" "-n -I -i -E" "$LEGACY_BRAND" .
          check_pattern "private/internal IPv4" "-n -I -E" "$PRIVATE_NET" .
          check_pattern "private key material" "-n -I -E" "$PRIV_KEY" .
          check_pattern "hardcoded DB URI credentials" "-n -I -E" "$DB_URI_CRED" . ':(exclude)app/__tests__/'
          check_pattern "non-empty secret in env files" "-n -I -E" "$ENV_SECRET_VAL" '*env*'
