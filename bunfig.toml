# Bun configuration for the ctk-system monorepo.
#
# `linker = "hoisted"` is required because Nuxt 4 + Vite 7 + the bundled
# exsolve module resolver expect real `node_modules/<scope>/<pkg>` symlinks.
# Bun 1.3's default "isolated" linker stores packages under
# `node_modules/.bun/<pkg>@<ver>+<hash>/node_modules/...` and only creates
# narrow junctions for the directly-installed workspace deps. That makes
# exsolve fail with "Cannot resolve module `@nuxt/kit`" when the @nuxt/cli
# walks the tree looking for sibling @nuxt/* packages.
#
# The hoisted linker restores the standard flat node_modules layout, which
# exsolve, Vite 7, Nuxt 4, and Vitest all expect.
[install]
linker = "hoisted"

# Treat Bun's bundled Node shim as the runtime for `node` so that legacy
# tools (e.g. `node -e "..."` in package.json scripts) resolve packages the
# same way as Bun itself.
[run]
shell = "system"
